name: Arcane Vault Native Release Publisher

on:
  workflow_run:
    workflows: ["Arcane Vault Next - .NET 10 Native Compatibility Spike"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-release-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified native build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $runId = "${{ github.event.workflow_run.id }}"
          } else {
            $runId = gh run list --repo "${{ github.repository }}" --workflow arcane-next-native.yml --limit 10 --json databaseId --jq '.[0].databaseId'
          }
          if (-not $runId) { throw "No native workflow build found" }
          $env:RUN_ID = [string]$runId
          $build = gh api "repos/${{ github.repository }}/actions/runs/$runId" | ConvertFrom-Json
          if ($build.event -ne 'push' -or $build.head_branch -ne 'main') {
            throw "Only main-branch push builds may be published"
          }
          New-Item -ItemType Directory -Force native-installer,native-package | Out-Null
          gh run download $runId --repo "${{ github.repository }}" --name ArcaneVaultNative-Installer-Preview --dir native-installer
          if ($LASTEXITCODE -ne 0) { throw "Cannot retrieve verified native installer" }
          gh run download $runId --repo "${{ github.repository }}" --name ArcaneVaultNext-NativePortable-TestBuild --dir native-package
          if ($LASTEXITCODE -ne 0) { throw "Cannot retrieve verified native portable build" }
          if (-not (Test-Path 'native-installer/ArcaneVaultSetup-win-x64.exe') -or
              -not (Test-Path 'native-package/ArcaneVaultNative-win-x64.zip')) {
            throw "Required installer/portable artifacts absent"
          }
          $build.head_sha | Set-Content native-package/source-sha.txt
      - name: Verify package SHA256 files
        shell: pwsh
        run: |
          foreach ($p in @('native-package/ArcaneVaultNative-win-x64.zip','native-installer/ArcaneVaultSetup-win-x64.exe')) {
            if (-not (Test-Path "$p.sha256")) { throw "Missing SHA256 for $p" }
            $actual = (Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()
            $text = Get-Content "$p.sha256" -Raw
            if ($text -notmatch "(?i)\\b$actual\\b") { throw "SHA256 mismatch: $p" }
          }
      - name: Publish checked native release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content 'ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+$') { throw "Invalid native version $version" }
          $tag = "native-v$version"
          $existing = gh release view $tag --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published: no replacement"
            exit 0
          }
          $notes = "releases/native-v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes $notes" }
          $sha = (Get-Content native-package/source-sha.txt -Raw).Trim()
          gh release create $tag native-package/ArcaneVaultNative-win-x64.zip native-package/ArcaneVaultNative-win-x64.zip.sha256 native-installer/ArcaneVaultSetup-win-x64.exe native-installer/ArcaneVaultSetup-win-x64.exe.sha256 --repo "${{ github.repository }}" --target $sha --title "Arcane Vault Native Windows v$version (Preview)" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release $tag failed" }
