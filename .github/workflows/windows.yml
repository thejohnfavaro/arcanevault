name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["windows-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: JavaScript regression checks
        shell: pwsh
        run: |
          node --check tests/regression.mjs
          node tests/regression.mjs
          node tests/new-features.mjs
      - name: Restore packages
        run: dotnet restore ArcaneVault.sln
      - name: Build solution
        run: dotnet build ArcaneVault.sln -c Release --no-restore
      - name: Execute C# checks
        run: dotnet run --project ArcaneVault.Tests/ArcaneVault.Tests.csproj -c Release --no-build
      - name: Publish Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish ArcaneVault.Desktop/ArcaneVault.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows-x64
          Compress-Archive -Path publish/windows-x64/* -DestinationPath ArcaneVault-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 ArcaneVault-Windows-x64.zip).Hash.ToLowerInvariant()
          Set-Content -Path ArcaneVault-Windows-x64.zip.sha256 -Value "$hash  ArcaneVault-Windows-x64.zip" -NoNewline
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVault-Windows-x64
          path: |
            ArcaneVault-Windows-x64.zip
            ArcaneVault-Windows-x64.zip.sha256
          if-no-files-found: error
      # A successful main-branch build publishes a new version only once.
      # Bump <Version> in the Windows .csproj to publish the next release.
      - name: Publish new Windows version to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content "ArcaneVault.Desktop/ArcaneVault.Desktop.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid Windows version '$version'. Expected major.minor.patch in the .csproj."
          }
          $tag = "windows-v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping publication."
            exit 0
          }
          Write-Host "Publishing Windows release $tag from verified build $env:GITHUB_SHA"
          gh release create $tag ArcaneVault-Windows-x64.zip ArcaneVault-Windows-x64.zip.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Arcane Vault Windows $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $tag" }
