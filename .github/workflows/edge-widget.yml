name: XENEON EDGE Widget Preview
on:
  push:
    branches: [main]
    paths:
      - 'integrations/xeneon-edge/**'
      - '.github/workflows/edge-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone widget JavaScript
        shell: pwsh
        run: node --check integrations/xeneon-edge/scripts/widget.js
      - name: Reject sample or debug deck fixtures in publishable widget
        shell: pwsh
        run: |
          $js = Get-Content integrations/xeneon-edge/scripts/widget.js -Raw
          foreach ($forbidden in @('Demo Commander Deck', 'SAMPLE PREVIEW', 'Demo Set Alpha', 'setProgress:{ownedSlots:834')) {
            if ($js.Contains($forbidden)) { throw "Publishable widget contains synthetic data fixture: $forbidden" }
          }
      - name: Verify original offline rank emblems
        shell: pwsh
        run: |
          $ranks = @('bronze','silver','gold','platinum','diamond','mythic')
          foreach ($rank in $ranks) {
            $icon = "integrations/xeneon-edge/resources/ranks/$rank.svg"
            if (!(Test-Path $icon)) { throw "Rank icon missing: $icon" }
            [xml]$svg = Get-Content $icon -Raw
            if ($svg.DocumentElement.LocalName -ne 'svg') { throw "Invalid SVG rank icon: $icon" }
          }
      - name: Install official iCUE Widget CLI
        shell: pwsh
        run: npm install -g icuewidget-cli@latest
      - name: Validate widget with official CLI
        shell: pwsh
        run: icuewidget validate integrations/xeneon-edge
      - name: Package iCUE widget with official CLI
        shell: pwsh
        run: icuewidget package integrations/xeneon-edge
      - name: Locate verified iCUE widget
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path . -Filter '*.icuewidget' -Recurse -File)
          if ($packages.Count -eq 0) { throw 'Official CLI did not produce an .icuewidget file.' }
          New-Item -ItemType Directory -Force -Path widget-dist | Out-Null
          $packages | ForEach-Object { Copy-Item $_.FullName -Destination 'widget-dist/' }
      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneVault-XeneonEdge-Widget-0.5-preview
          path: widget-dist/*.icuewidget
          if-no-files-found: error
      - name: Publish independent EDGE widget preview release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'edge-widget-v0.5.0'
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "EDGE widget $tag is already published; leaving existing immutable version intact."
          } else {
            $files = @(Get-ChildItem 'widget-dist/*.icuewidget' -File | ForEach-Object { $_.FullName })
            gh release create $tag @files --repo ${{ github.repository }} --target ${{ github.sha }} --title 'Arcane Vault XENEON EDGE Widget v0.5.0 (Preview)' --notes 'Adds six original offline rank emblems (Bronze through Mythic) alongside Constructed and Limited rank snapshots. Retains W/L and existing dashboard preferences. Requires Arcane Vault Native v0.9.148 for rank data.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish XENEON EDGE release.' }
          }
