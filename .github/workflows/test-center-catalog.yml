name: Offline Test Center - Catalog Contract

on:
  pull_request:
    paths:
      - 'ArcaneVault.Next.Tests/Program.cs'
      - 'tools/TestCenter/**'
      - 'tools/Run-GuidedChecks.ps1'
      - '.github/workflows/test-center-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ArcaneVault.Next.Tests/Program.cs'
      - 'tools/TestCenter/**'
      - 'tools/Run-GuidedChecks.ps1'
      - '.github/workflows/test-center-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite-inventory:
    name: Verify readable offline test inventory
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify catalog exactly matches current named C# suites
        shell: powershell
        run: |
          & .\tools\TestCenter\Sync-TestCatalog.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify system coverage map has reviewed evidence and no unassigned suites
        shell: powershell
        run: |
          & .\tools\TestCenter\Test-CoverageMap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test UI smoke geometry and WPF automation contract (no desktop required)
        shell: powershell
        run: |
          & .\tools\TestCenter\Run-UiSmoke.ps1 -SelfTest -ReportDir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'UI smoke self-test failed' }
          $report = Get-ChildItem $env:RUNNER_TEMP -Filter 'ui-smoke-*.json' |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $report) { throw 'UI smoke test did not create its JSON evidence' }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.status -ne 'PASS' -or $data.tests[0].id -ne 'UI-SMOKE-SELFTEST') {
            throw 'UI smoke geometry self-test did not report PASS'
          }
          foreach ($file in @(
            'ArcaneVault.Next.Desktop/NativeDeckEditorWindow.xaml',
            'ArcaneVault.Next.Desktop/NativeDeckEditorView.xaml'
          )) {
            $xaml = Get-Content $file -Raw
            foreach ($id in @('AV.Mainboard.Rows','AV.Mainboard.Search',
              'AV.Mainboard.Composition','AV.Mainboard.Status',
              'AV.Mainboard.FullDetails','AV.Preview.CardName',
              'AV.Preview.Status','AV.Preview.Artwork','AV.Preview.Fallback')) {
              if (-not $xaml.Contains($id)) { throw "Missing WPF UIA hook: $file $id" }
            }
          }
          $analytics = Get-Content ArcaneVault.Next.Desktop/NativeMatchPerformancePanel.cs -Raw
          foreach ($id in @('AV.Analytics.FormatHeading','AV.Analytics.RecordedColorsHeading',
            'AV.Analytics.ObservedColorsHeading')) {
            if (-not $analytics.Contains($id)) { throw "Missing UIA analytics hook: $id" }
          }
      - name: Verify screenshot comparator self-test (synthetic images only)
        shell: powershell
        run: |
          & .\\tools\\TestCenter\\Run-UiRegression.ps1 -SelfTest -ReportDir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'UI screenshot comparator self-test failed' }
          $report = Get-ChildItem $env:RUNNER_TEMP -Filter 'ui-regression-*.json' |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $report) { throw 'UI regression self-test produced no JSON report' }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.status -ne 'PASS' -or $data.tests[0].id -ne 'UI-REGRESSION-SELFTEST') {
            throw 'UI regression self-test did not report PASS'
          }
      - name: Package standalone Windows Test Center GUI
        shell: powershell
        run: |
          & .\\tools\\TestCenter\\Package-Standalone.ps1 -OutputPath "$env:RUNNER_TEMP\\ArcaneVault-TestCenter-Standalone.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Test Center ZIP failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP\\ArcaneVault-TestCenter-Standalone.zip")) {
            throw 'Standalone Test Center archive missing'
          }
      - name: Upload standalone Test Center ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneVault-TestCenter-Standalone
          path: ${{ runner.temp }}/ArcaneVault-TestCenter-Standalone.zip
          if-no-files-found: error
          retention-days: 14
      - name: Confirm catalog updater is deterministic and offline
        shell: powershell
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'generated-test-catalog.json'
          & .\tools\TestCenter\Sync-TestCatalog.ps1 -CatalogPath $temp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\TestCenter\Sync-TestCatalog.ps1 -Check -CatalogPath $temp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $committed = (Get-Content .\tools\TestCenter\Tests-Catalog.json -Raw | ConvertFrom-Json)
          $generated = (Get-Content $temp -Raw | ConvertFrom-Json)
          if ($committed.tests.Count -ne $generated.tests.Count) { throw 'Generated inventory count changed' }
          Write-Host ('PASS: ' + $generated.tests.Count + ' discoverable suites; no dotnet or network used.')
