name: Arcane Vault Next - .NET 10 Native Compatibility Spike

on:
  pull_request:
    paths:
      - 'ArcaneVault.Next.Desktop/**'
      - 'ArcaneVault.Next.Launcher/**'
      - 'installer/**'
      - 'ArcaneVault.Next.Domain/**'
      - 'ArcaneVault.Next.Collection/**'
      - 'ArcaneVault.Next.EDHLab/**'
      - 'ArcaneVault.Next.Migration/**'
      - 'contracts/**'
      - 'ArcaneVault.Next.Tests/**'
      - '.github/workflows/arcane-next-native.yml'
      - 'releases/native-v*.md'
  push:
    branches: [main]
    paths:
      - 'ArcaneVault.Next.Migration/**'
      - 'ArcaneVault.Next.Desktop/**'
      - 'ArcaneVault.Next.Launcher/**'
      - 'installer/**'
      - 'ArcaneVault.Next.Domain/**'
      - 'ArcaneVault.Next.Collection/**'
      - 'ArcaneVault.Next.EDHLab/**'
      - 'contracts/**'
      - 'ArcaneVault.Next.Tests/**'
      - '.github/workflows/arcane-next-native.yml'
      - 'releases/native-v*.md'
  workflow_dispatch:

permissions:
  contents: write

# Prevent older partial commits from publishing over the most recent build.
concurrency:
  group: native-windows-main
  cancel-in-progress: true

jobs:
  net10-wpf-spike:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify SDK
        run: dotnet --version
      - name: Install asset generator
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build approved Windows icon and installer brand assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python tools/build_windows_brand.py
          if ($LASTEXITCODE -ne 0) { throw "Brand asset generation failed" }
          foreach ($file in @(
            "ArcaneVault.Next.Desktop/Assets/ArcaneVault.ico",
            "ArcaneVault.Next.Desktop/Assets/ArcaneVaultIcon.png",
            "ArcaneVault.Next.Desktop/Assets/ArcaneVaultSidebar.png",
            "installer/brand/ArcaneVaultWizard.bmp",
            "installer/brand/ArcaneVaultWizardSmall.bmp",
            "installer/brand/ArcaneVaultWizardHeader.bmp"
          )) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 1000) {
              throw "Missing generated brand artwork: $file"
            }
          }
      - name: Restore WPF prototype
        run: dotnet restore ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj
      - name: Compile WPF prototype
        run: dotnet build ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release --no-restore
      - name: Restore native catalog regression project
        run: dotnet restore ArcaneVault.Next.Tests/ArcaneVault.Next.Tests.csproj
      - name: Test consistent read-only SQLite snapshot and record query timing
        run: dotnet run --project ArcaneVault.Next.Tests/ArcaneVault.Next.Tests.csproj -c Release --no-restore
      - name: Verify native acceptance check is read-only and detects changed files
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("native-acceptance-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $workspace = Join-Path $fixture "native-data"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $db = Join-Path $workspace "native-workspace.sqlite"
          $catalog = Join-Path $workspace "native-catalog.sqlite"
          Set-Content -Path $db -Value "synthetic native inventory" -NoNewline
          Set-Content -Path $catalog -Value "synthetic catalog" -NoNewline
          $origDb = (Get-FileHash $db -Algorithm SHA256).Hash
          $origCatalog = (Get-FileHash $catalog -Algorithm SHA256).Hash
          $baseline = Join-Path $fixture "baseline.json"
          & ./tools/NativeWindowsAcceptance.ps1 -Mode Capture -WorkspaceDirectory $workspace -ReportPath $baseline
          if (-not (Test-Path $baseline)) { throw "Acceptance baseline not created" }
          & ./tools/NativeWindowsAcceptance.ps1 -Mode Compare -WorkspaceDirectory $workspace -BaselinePath $baseline
          if ((Get-FileHash $db -Algorithm SHA256).Hash -ne $origDb -or
              (Get-FileHash $catalog -Algorithm SHA256).Hash -ne $origCatalog) {
            throw "Acceptance script mutated native files"
          }
          Add-Content -Path $db -Value "simulated intentional change"
          $rejected = $false
          try {
            & ./tools/NativeWindowsAcceptance.ps1 -Mode Compare -WorkspaceDirectory $workspace -BaselinePath $baseline
          } catch {
            if ($_.Exception.Message -match "ACCEPTANCE MISMATCH") { $rejected = $true }
            else { throw }
          }
          if (-not $rejected) { throw "Acceptance comparison missed changed native data" }
          $rejected = $false
          try {
            & ./tools/NativeWindowsAcceptance.ps1 -Mode Capture -WorkspaceDirectory $workspace -ReportPath (Join-Path $workspace "unsafe.json")
          } catch {
            if ($_.Exception.Message -match "OUTSIDE") { $rejected = $true }
            else { throw }
          }
          if (-not $rejected) { throw "Acceptance script allowed output inside user data" }
      - name: Publish isolated preview artifact
        run: dotnet publish ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release -r win-x64 --self-contained false -o preview/ArcaneVaultNextNative
      - name: Publish native Windows x64 standalone bundle (bundled .NET runtime)
        run: dotnet publish ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview/ArcaneVaultNextStandalone
      - name: Package checksummed native Windows portable test build
        shell: pwsh
        run: |
          $source = "preview/ArcaneVaultNextStandalone"
          New-Item -ItemType Directory -Path (Join-Path $source "Tools") -Force | Out-Null
          Copy-Item "tools/NativeWindowsAcceptance.ps1" -Destination (Join-Path $source "Tools/NativeWindowsAcceptance.ps1")
          [xml]$project = Get-Content "ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid native version: $version" }
          $manifest = @{
            version = $version
            sourceSha = $env:GITHUB_SHA
            channel = "preview"
          } | ConvertTo-Json -Compress
          Set-Content -Path (Join-Path $source "native-version.json") -Value $manifest -Encoding utf8
          $exe = Join-Path $source "ArcaneVault.Next.Desktop.exe"
          if (-not (Test-Path $exe)) { throw "Standalone executable missing: $exe" }
          New-Item -ItemType Directory -Path native-package -Force | Out-Null
          $archive = "native-package/ArcaneVaultNext-NativePortable-win-x64.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  ArcaneVaultNext-NativePortable-win-x64.zip"
          Copy-Item -Path $archive -Destination "native-package/ArcaneVaultNative-win-x64.zip"
          Set-Content -Path "native-package/ArcaneVaultNative-win-x64.zip.sha256" -Value "$hash  ArcaneVaultNative-win-x64.zip"
          @(
            "Arcane Vault Native Portable - TEST BUILD, NOT 1.0"
            "Source commit: $env:GITHUB_SHA"
            "Source: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
            "Workflow: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "OS: Windows x64; .NET Desktop runtime bundled"
            "Data location: %LOCALAPPDATA%\\ArcaneVaultNext"
            "Keep a private full collection backup before upgrading."
            "No updater, installer, or real-device acceptance is implied."
          ) | Set-Content -Path native-package/BUILD-IDENTITY.txt
          $unpacked = Join-Path $env:RUNNER_TEMP "ArcaneVaultNextNativeZipCheck-$env:GITHUB_RUN_ID"
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          if (-not (Test-Path (Join-Path $unpacked "ArcaneVault.Next.Desktop.exe"))) {
            throw "Portable archive is missing its executable after extraction."
          }
          if (-not (Test-Path (Join-Path $unpacked "Tools/NativeWindowsAcceptance.ps1"))) {
            throw "Native acceptance test script not packaged."
          }
          $installedManifest = Get-Content -Raw (Join-Path $unpacked "native-version.json") | ConvertFrom-Json
          if ($installedManifest.version -ne $version -or
              $installedManifest.sourceSha -ne $env:GITHUB_SHA -or
              $installedManifest.channel -ne "preview") {
            throw "Extracted native package identity does not match the source commit/version."
          }
          $secondHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $secondHash) { throw "Portable archive SHA-256 changed unexpectedly." }
      - name: Publish permanent native Windows launcher
        shell: pwsh
        run: |
          dotnet publish ArcaneVault.Next.Launcher/ArcaneVault.Next.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o preview/ArcaneVaultLauncher
          if ($LASTEXITCODE -ne 0) { throw "Permanent launcher compilation failed." }
          if (-not (Test-Path "preview/ArcaneVaultLauncher/ArcaneVault.exe")) { throw "Pinned launcher executable missing." }
          [xml]$project = Get-Content "ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          Set-Content -Path "preview/ArcaneVaultLauncher/active-version.txt" -Value "v$version" -NoNewline

      - name: Compile and verify one-time per-user Windows installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content "ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found; cannot publish an unverified installer." }
          & $iscc "/DAppVersion=$version" "installer/ArcaneVaultNative.iss"
          if ($LASTEXITCODE -ne 0) { throw "Native Windows installer compilation failed." }
          $setup = "native-installer/ArcaneVaultSetup-win-x64.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built." }
          $digest = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$setup.sha256" -Value "$digest  ArcaneVaultSetup-win-x64.exe" -NoNewline
          if ((Get-Content "preview/ArcaneVaultLauncher/active-version.txt" -Raw).Trim() -ne "v$version") {
            throw "Installed launcher points at the wrong initial version."
          }

      - name: Upload stable launcher installer (unsigned preview)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNative-Installer-Preview
          path: |
            native-installer/ArcaneVaultSetup-win-x64.exe
            native-installer/ArcaneVaultSetup-win-x64.exe.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish migration preview as a self-contained diagnostic EXE
        run: dotnet publish ArcaneVault.Next.Migration/ArcaneVault.Next.Migration.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview/MigrationPreview
      - name: Upload opt-in offline migration diagnostic (not an application release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-MigrationPreview-AVN005
          path: preview/MigrationPreview/**
          retention-days: 14
          if-no-files-found: error
      - name: Upload self-contained native Windows bundle (not a signed installer)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativeStandalone
          path: preview/ArcaneVaultNextStandalone/**
          retention-days: 14
          if-no-files-found: error
      - name: Upload checksummed native portable test build (not a 1.0 release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativePortable-TestBuild
          path: native-package/**
          retention-days: 30
          if-no-files-found: error
      - name: Upload native UI prototype (not an application release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativeUI-SPIKE
          path: preview/ArcaneVaultNextNative/**
          retention-days: 14
          if-no-files-found: error
      # Publish only after the native regression suite and ZIP identity checks.
      # Preview releases cannot silently replace existing versions.
      - name: Publish versioned native preview release (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content "ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch "^[0-9]+[.][0-9]+[.][0-9]+") {
            throw "Invalid native version $version"
          }
          $tag = "native-v$version"
          $existingTarget = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingTarget.Trim() -ne $env:GITHUB_SHA) {
              throw "Native release $tag already belongs to $existingTarget, not this commit. Bump the native version before publishing changes."
            }
            Write-Host "Native preview $tag is already published from this exact commit."
            exit 0
          }
          $notes = "releases/native-v$version.md"
          if (-not (Test-Path $notes)) {
            throw "Missing native preview release notes $notes"
          }
          $content = Get-Content $notes -Raw
          foreach ($section in @('Added','Changed','Fixed','Removed')) {
            if ($content -notmatch "(?m)^## $section\s*$") {
              throw "Native preview notes are missing ## $section"
            }
          }
          gh release create $tag native-package/ArcaneVaultNative-win-x64.zip native-package/ArcaneVaultNative-win-x64.zip.sha256 native-installer/ArcaneVaultSetup-win-x64.exe native-installer/ArcaneVaultSetup-win-x64.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Arcane Vault Native Windows v$version (Preview)" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish native preview $tag"
          }
