name: Arcane Vault Next - .NET 10 Native Compatibility Spike

on:
  pull_request:
    paths:
      - 'ArcaneVault.Next.Desktop/**'
      - 'ArcaneVault.Next.Domain/**'
      - 'ArcaneVault.Next.Collection/**'
      - 'ArcaneVault.Next.EDHLab/**'
      - 'ArcaneVault.Next.Migration/**'
      - 'contracts/**'
      - 'ArcaneVault.Next.Tests/**'
      - '.github/workflows/arcane-next-native.yml'
      - 'ArcaneVault.Desktop/**'
  push:
    branches: [main]
    paths:
      - 'ArcaneVault.Next.Migration/**'
      - 'ArcaneVault.Next.Desktop/**'
      - 'ArcaneVault.Next.Domain/**'
      - 'ArcaneVault.Next.Collection/**'
      - 'ArcaneVault.Next.EDHLab/**'
      - 'contracts/**'
      - 'ArcaneVault.Next.Tests/**'
      - '.github/workflows/arcane-next-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net10-wpf-spike:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify SDK
        run: dotnet --version
      - name: Restore WPF prototype
        run: dotnet restore ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj
      - name: Compile WPF prototype
        run: dotnet build ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release --no-restore
      - name: Restore native catalog regression project
        run: dotnet restore ArcaneVault.Next.Tests/ArcaneVault.Next.Tests.csproj
      - name: Test consistent read-only SQLite snapshot and record query timing
        run: dotnet run --project ArcaneVault.Next.Tests/ArcaneVault.Next.Tests.csproj -c Release --no-restore
      - name: Check existing desktop source on .NET 10 without changing shipping TFM
        shell: pwsh
        run: |
          dotnet restore ArcaneVault.Desktop/ArcaneVault.Desktop.csproj -p:TargetFramework=net10.0-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ArcaneVault.Desktop/ArcaneVault.Desktop.csproj -c Release --no-restore -p:TargetFramework=net10.0-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish isolated preview artifact
        run: dotnet publish ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release -r win-x64 --self-contained false -o preview/ArcaneVaultNextNative
      - name: Publish native Windows x64 standalone bundle (bundled .NET runtime)
        run: dotnet publish ArcaneVault.Next.Desktop/ArcaneVault.Next.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview/ArcaneVaultNextStandalone
      - name: Package checksummed native Windows portable test build
        shell: pwsh
        run: |
          $source = "preview/ArcaneVaultNextStandalone"
          $exe = Join-Path $source "ArcaneVault.Next.Desktop.exe"
          if (-not (Test-Path $exe)) { throw "Standalone executable missing: $exe" }
          New-Item -ItemType Directory -Path native-package -Force | Out-Null
          $archive = "native-package/ArcaneVaultNext-NativePortable-win-x64.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  ArcaneVaultNext-NativePortable-win-x64.zip"
          @(
            "Arcane Vault Native Portable - TEST BUILD, NOT 1.0"
            "Source commit: $env:GITHUB_SHA"
            "Source: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
            "Workflow: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "OS: Windows x64; .NET Desktop runtime bundled"
            "Data location: %LOCALAPPDATA%\\ArcaneVaultNext"
            "Keep the installed legacy Arcane Vault and a private full backup."
            "No updater, installer, or real-device acceptance is implied."
          ) | Set-Content -Path native-package/BUILD-IDENTITY.txt
          $unpacked = Join-Path $env:RUNNER_TEMP "ArcaneVaultNextNativeZipCheck-$env:GITHUB_RUN_ID"
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          if (-not (Test-Path (Join-Path $unpacked "ArcaneVault.Next.Desktop.exe"))) {
            throw "Portable archive is missing its executable after extraction."
          }
          $secondHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $secondHash) { throw "Portable archive SHA-256 changed unexpectedly." }
      - name: Publish migration preview as a self-contained diagnostic EXE
        run: dotnet publish ArcaneVault.Next.Migration/ArcaneVault.Next.Migration.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview/MigrationPreview
      - name: Upload opt-in offline migration diagnostic (not an application release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-MigrationPreview-AVN005
          path: preview/MigrationPreview/**
          retention-days: 14
          if-no-files-found: error
      - name: Upload self-contained native Windows bundle (not a signed installer)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativeStandalone
          path: preview/ArcaneVaultNextStandalone/**
          retention-days: 14
          if-no-files-found: error
      - name: Upload checksummed native portable test build (not a 1.0 release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativePortable-TestBuild
          path: native-package/**
          retention-days: 30
          if-no-files-found: error
      - name: Upload native UI prototype (not an application release)
        uses: actions/upload-artifact@v6
        with:
          name: ArcaneVaultNext-NativeUI-SPIKE
          path: preview/ArcaneVaultNextNative/**
          retention-days: 14
          if-no-files-found: error
